<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/output.css" />
    <title>Movie Diary</title>
  </head>
  <body>
    <header class="bg-surface sticky top-0 z-10">
      <div
        class="max-w-page mx-auto flex px-6 py-4 justify-between items-center"
      >
        <a href="index.html">
          <h1 class="text-h2">Movie Diary</h1>
        </a>
        <nav>
          <ul class="flex gap-6">
            <li>
              <a href="index.html" class="nav-link">Discover</a>
            </li>
            <li>
              <a href="diary.html" class="nav-link">Diary</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
    <main class="flex-1">
      <section class="max-w-page mx-auto px-6 py-8">
        <h2 class="text-h1 mb-4">Discover something worth watching</h2>
        <form id="search-form" class="flex gap-2 max-w-md">
          <label for="search" class="sr-only">Search for a movie</label>
          <input
            type="search"
            name="search"
            id="search"
            placeholder="Search a film ..."
            class="search-input"
          />
          <button
            type="submit"
            aria-label="Search"
            class="btn-primary px-4 w-auto"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-5"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="m21 21-4.35-4.35m1.35-5.4a6.75 6.75 0 1 1-13.5 0 6.75 6.75 0 0 1 13.5 0Z"
              />
            </svg>
          </button>
        </form>
      </section>

      <section class="max-w-page mx-auto px-6 py-8">
        <h2 class="text-h1 mb-4">Popular Movies</h2>
        <div
          id="movie-container"
          class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"
        ></div>
      </section>

      <template id="movie-card-template">
        <article class="movie-card h-full flex flex-col">
          <img class="movie-card__poster w-full aspect-[2/3] object-cover" />
          <div class="p-4 space-y-2 flex flex-col flex-1">
            <h3 class="movie-card__title text-h2 line-clamp-2"></h3>
            <div class="flex items-center gap-2 text-small text-text-secondary">
              <span class="movie-card__year"></span>
              <span class="movie-card__rating text-cine"></span>
            </div>
            <div class="movie-card__genres flex flex-wrap gap-1"></div>
            <p
              class="movie-card__description text-small text-text-muted line-clamp-3 flex-1"
            ></p>
            <div class="movie-card__actions space-y-2 mt-auto pt-2"></div>
          </div>
        </article>
      </template>
    </main>
    <footer
      class="max-w-page mx-auto w-full px-6 py-8 text-center text-small text-text-muted"
    >
      <p>© 2026 Movie Diary · Data provided by TMDB</p>
    </footer>
    <script type="module" src="js/movies.js"></script>
  </body>
</html>
