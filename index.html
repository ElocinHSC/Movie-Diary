<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/output.css" />
    <title>Movie Diary</title>
  </head>
  <body>
    <header class="bg-surface">
      <div
        class="max-w-page mx-auto flex px-6 py-4 justify-between items-center"
      >
        <a href="index.html">
          <h1>Movie Diary</h1>
        </a>
        <nav>
          <ul class="flex gap-6">
            <li>
              <a
                href="index.html"
                class="text-text-secondary hover:text-text-primary"
                >Discover</a
              >
            </li>
            <li>
              <a
                href="diary.html"
                class="text-text-secondary hover:text-text-primary"
                >Diary</a
              >
            </li>
          </ul>
        </nav>
      </div>
    </header>
    <main>
      <section class="max-w-page mx-auto px-6 py-8">
        <h2>Discover something worth watching</h2>
        <form id="search-form">
          <label for="search">Search for a movie</label>
          <input
            type="search"
            name="search"
            id="search"
            placeholder="Search a film ..."
          />
          <button type="submit" aria-label="Search">Lupe</button>
        </form>
      </section>

      <section class="max-w-page mx-auto px-6 py-8">
        <h2>Popular Movies</h2>
        <div
          id="movie-container"
          class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"
        ></div>
      </section>

      <template id="movie-card-template">
        <article
          class="movie-card bg-surface rounded-card overflow-hidden shadow-card hover:shadow-card-hover hover:scale-[1.02] transition-transform duration-standard"
        >
          <img
            alt="..."
            class="movie-card__poster w-full aspect-2/3 object-cover"
          />
          <div class="p-4 space-y-2">
            <h3 class="movie-card__title text-h2 line-clamp-2"></h3>
            <div class="flex items-center gap-2 text-small text-secondary">
              <span class="movie-card__year"></span>
              <span class="movie-card__rating text-cine"></span>
            </div>
            <div class="movie-card__genres flex flex-wrap gap-1"></div>
            <p
              class="movie-card__description text-small text-muted line-clamp-3"
            ></p>
            <div class="movie-card__actions"></div>
          </div>
        </article>
      </template>
    </main>
    <footer></footer>
    <script type="module" src="js/movies.js"></script>
  </body>
</html>
